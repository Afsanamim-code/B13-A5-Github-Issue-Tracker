<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title  -->
    <title>Github Issue Tracker - Sign In</title>
    <!-- Google Font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"  
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" 
    referrerpolicy="no-referrer" />
    <!-- Fav Icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
    <!-- Styles  -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="min-h-screen w-full flex justify-center items-center bg-[#F8FAFC] p-2">

        <div class="max-w-[520px] w-full bg-white shadow-lg rounded-md border border-gray-100 sm:p-7">

            <!-- Top -->
            <div class="flex flex-col items-center">
                <img src="./assets/github-logo.png" 
                alt="GitHub Logo" 
                class="sm:size-23 size-16 mb-4">
                <h2 class="font-bold sm:text-2xl text-xl">
                    GitHub Issues Tracker
                </h2>
                <p class="font-medium text-[#64748B] text-sm">
                    Sign in to manage your issues
                </p>
            </div>

            <!-- Form -->
            <form 
                id="loginForm"
                class="flex flex-col sm:gap-4 gap-2 sm:mt-5 mt-2">
                <div class="space-y-2">
                    <label for="usernameInput" 
                        class="font-medium sm:text-lg text-sm">
                        Username
                    </label>
                    <input 
                        id="usernameInput"
                        type="text" 
                        placeholder="Enter Username"
                        class="w-full border border-gray-300
                        rounded-md px-3 py-2 text-sm">
                    <p class="text-sm text-red-500 hidden"  
                    id="usernameError">Username is required</p>    
                    <p class="text-[#4A00FF] text-sm">
                        Default: admin
                    </p>
                </div>
                <div class="space-y-2">
                    <label for="passwordInput" 
                        class="font-medium sm:text-lg text-sm">
                        Password
                    </label>
                    <div 
                        class="flex items-center relative">
                        <input 
                            id="passwordInput"
                            type="password" 
                            placeholder="Enter Password" 
                            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        <button 
                            id="passwordToggle"
                            type="button"
                            class="absolute right-2 text-gray-600 cursor-pointer
                          hover:text-gray-700 hover:scale-90 transition-all 
                            duration-200 text-sm"
                            >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-sm text-red-500 hidden"  
                    id="passwordError">Password is required</p>
                    <p 
                        class="text-[#4A00FF] text-sm">
                        Default: admin123
                    </p>
                </div>
                <button 
                    class="bg-[#4A00FF] w-full p-2 rounded-md text-white
                    mt-5 cursor-pointer hover:bg-[#3700C8] hover:shadow-md 
                    hover:-translate-y-0.5 transition-all duration-200"
                    type="submit">
                    Sign In
                </button>
            </form>
            <!-- Bottom -->
            <div class="mt-5">      
                <div class="flex items-center gap-4">
                    <span class="flex-1 h-px bg-gray-300"></span>
                    <span class="">OR</span>
                    <span class="flex-1 h-px bg-gray-300"></span>
                </div>
                <div>
                <p class="mt-2 text-[#64748B] font-semibold text-center text-sm">
                    Demo Credentials:
                </p>
                <div class="bg-gray-100 rounded-lg p-4 text-center mt-5">
                    <p class="text-sm font-semibold">Username: 
                        <span class="font-normal text-gray-700">admin</span>
                    </p>
                    <p class="text-sm font-semibold">Password: 
                        <span class="font-normal text-gray-700">admin123</span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="./js/login.js"></script>
</body>
</html>
