<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title  -->
    <title>Github Issue Tracker - IssueFlow</title>

    <!-- Google Font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" 
      rel="stylesheet"
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"  
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" 
      referrerpolicy="no-referrer" 
    />

    <!-- Fav Icon -->
    <link 
      rel="shortcut icon" 
      href="./assets/github-logo.png"
      type="image/x-icon">

    <!-- Styles  -->
    <link rel="stylesheet" href="./style.css">

</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <!-- NAVBAR -->

   <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">

    <div class="mx-auto flex max-w-[1360px] flex-col gap-4 py-4 px-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">

      <!-- Brand -->
      <div class="flex items-center gap-3">

        <img 
          src="./assets/github-logo.png" 
          alt="GitHub logo" 
          class="size-10 sm:size-11"
        >

        <div>
          <h1 class="text-lg font-bold tracking-tight sm:text-xl">
            GitHub Issues Tracker
          </h1>
          <p class="hidden text-xs text-slate-400 sm:block">
            Manage your project issues
          </p>
        </div>

      </div>

      <!-- Search -->
      <div class="flex gap-2 w-full sm:max-w-md"> 

      <label class="relative flex-1 min-w-0">

        <i 
          class="fa-solid fa-magnifying-glass pointer-events-none
          absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400"
        ></i> 

        <input 
          type="search" 
          id="searchInput" 
          placeholder="Search issues..." 
          class="h-11 w-full rounded-lg border border-slate-200 bg-slate-50 pl-9 pr-3 text-sm 
          outline-none transition focus:border-blue-400 focus:bg-white focus:ring-2 focus:ring-blue-100"
        > 

      </label>  

      <button 
        type="button" 
        id="searchButton" 
        class="h-11 shrink-0 rounded-lg bg-blue-700 px-4 text-sm font-semibold text-white shadow-sm 
         transition hover:bg-blue-800 active:scale-95"
        > 
          <i class="fa-solid fa-magnifying-glass sm:mr-1"></i> 
          <span class="hidden sm:inline">Search</span> 
      </button> 

      </div> 

    </div>

  </header>


   <!-- MAIN -->
  <main class="max-w-[1360px] mx-auto px-4 py-6 sm:px-6 lg:px-8 lg:py-8">

    <!-- Tabs -->
      <section class="mb-6 rounded-xl border border-slate-200 bg-white p-4 shadow-md">

        <div class="flex flex-wrap gap-2">

          <button 
            id="allTab"
            type="button" 
            class="rounded-lg px-8 py-2 text-sm font-semibold border border-slate-300 shadow-md transition active:scale-95"
          >
            All
          </button>

          <button 
          id="openTab" 
          class="rounded-lg px-7 py-2 text-sm font-semibold border border-slate-300 shadow-md transition active:scale-95"
        >
          Open
        </button>

        <button 
          id="closedTab" 
          class="rounded-lg px-6 py-2 text-sm font-semibold border border-slate-300 shadow-md transition active:scale-95"
        >
          Closed
        </button>

      </div>

     </section>

    <!-- Issue area -->
     <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">

      <!-- section header -->
       <div class="flex flex-col gap-4 border-b border-slate-200 px-5 py-5 sm:items-center sm:flex-row sm:justify-between">

        <!-- left -->
        <div class="flex items-center gap-3">

          <img src="./assets/Aperture.png" alt="" class="rounded-full bg-[#ECE4FF] p-2 size-11">

          <div>

            <h2 
              id="issueCount" 
              class="text-xl font-bold capitalize text-slate-900"
            >
              0 Issues
            </h2>

            <p class="text-sm font-medium text-gray-400">
              Track and manage your project issues
            </p>

          </div>

        </div>


        <!-- Status Legend -->
        <div class="flex items-center gap-5 text-sm">

          <div class="flex items-center gap-2">
            <span class="size-3 rounded-full bg-[#00A96E]"></span>
            <h4 class="font-medium text-slate-600 ">Open</h4>
          </div>

          <div class="flex items-center gap-2">
            <span class="size-3 rounded-full bg-[#A855F7]"></span>
            <h4 class="font-medium text-slate-600">Closed</h4>
          </div>

        </div>

      </div>

      <!-- Cards -->
      <div 
        id="issueContainer" 
        class="grid grid-cols-1 gap-5 bg-slate-50/60 p-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      >
      </div>


      <!-- Loading spinner -->
      <div 
        id="loadingSpinner" 
        class="hidden min-h-[60vh] w-full justify-center items-center"
      >
        <div class="flex flex-col items-center gap-3">
          <span class="h-10 w-10 animate-[spin_0.6s_linear_infinite] rounded-full border-4 border-slate-200 border-t-blue-600"
          ></span>

          <p class="text-sm font-medium text-slate-400">
            Loading issues...
          </p>
        </div>
      </div>

      <!-- Empty state -->

      <div 
        id="emptyState" 
        class="px-5 py-20 text-center hidden min-h-[400px]"
      >

        <div class="mx-auto mb-4 grid size-16 place-items-center bg-slate-100 rounded-full text-slate-500">

          <i class="fa-solid fa-magnifying-glass text-xl"></i>

        </div>

        <h3 class="text-slate-700 font-bold">
          No issues found
        </h3>

        <p class="mt-1 text-sm text-slate-400">
          Try another search or switch to a different filter.
        </p>

      </div>

     </section>

  </main>


      <!-- ISSUE MODAL -->
        <div 
          id="issueModal" 
          class="fixed inset-0 z-50 flex justify-center items-center bg-slate-950/50 p-4 hidden"
        >

          <div class="max-w-xl w-full overflow-hidden rounded-2xl bg-white shadow-2xl"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
            >

            <!-- header -->
          <div class="border-b border-slate-200 px-6 py-6">

            <div class="flex justify-between items-start gap-4">

              <div>

                <h3 id="modalTitle" class="text-xl font-bold text-slate-900"></h3>

                <div id="modalMeta" class="mt-5 flex flex-wrap items-center gap-2 text-sm">

                  <span id="modalStatus" 
                    class="font-medium rounded-full px-3 py-1 text-xs text-white">
                  </span>

                  <span class="text-slate-300">•</span>

                  <span class="text-sm text-gray-400"
                  >
                    Opened by
                  <span id="modalAuthor" class="font-medium text-gray-500"></span>
                  </span>

                  <span class="text-slate-300">•</span>

                  <span id="modalDate" class="text-sm text-slate-400"></span>

                </div>

              </div>

              <button 
                id="closeModalButton"
                type="button"
                class="grid size-9 shrink-0 place-items-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
                aria-label="Close modal"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>


            </div>

          </div>

            <!-- body -->
            <div class="space-y-4 px-6 py-5">

              <!-- Modal Loading Spinner -->
              <div 
                id="modalLoadingSpinner"
                class="hidden min-h-[280px] items-center justify-center"
              >
                <div class="flex flex-col items-center gap-3">

                  <span 
                    class="h-10 w-10 animate-[spin_0.6s_linear_infinite] rounded-full border-4 border-slate-200 border-t-blue-600"
                  ></span>

                  <p class="text-sm font-medium text-slate-400">
                    Loading issue...
                  </p>

                </div>

              </div> 
              
              <!-- Labels -->
              <div 
                id="modalLabels" 
                class="flex flex-wrap gap-2 capitalize"
              ></div>


              <!-- Description -->

              <div 
                id="modalDescription" 
                class="text-sm leading-6 text-gray-500">
              </div>

              <!-- Information -->
              <div id="modalInformation" class="grid grid-cols-2 gap-3 rounded-xl bg-slate-50 p-4">

                <div>

                  <p class="text-xs text-gray-400 mb-1">
                    Assignee:
                  </p>

                  <span 
                    id="modalAssignee"  
                    class="capitalize font-semibold text-sm text-[#1F2937]">
                  </span>

                </div>

                <div>

                  <p class="text-xs text-gray-400 mb-1">
                    Priority:
                  </p>
                  <span
                    id="modalPriority" 
                    class="capitalize px-3 py-1 text-[12px] rounded-full bg-[#EF4444] text-white">
                  </span>

                </div>

              </div>

            </div>

            <!-- footer -->
            <div class="flex justify-end border-t border-slate-100 py-4 px-6">

              <button
                id="modalCloseAction"
                type="button" 
                class="bg-blue-700 rounded-lg px-5 py-2 text-sm font-semibold text-white hover:bg-blue-950"
              >
              Close
              </button>

            </div>  

        </div>

      </div>  

      <script src="./js/home.js"></script>

</body>

</html>
